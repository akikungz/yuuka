apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tls
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  tls.crt: "<CERTIFICATE_DATA>"
  tls.key: "<PRIVATE_KEY_DATA>"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: tls
type: Opaque
stringData:
  api-token: "<CLOUDFLARE_API_TOKEN>" # Replace with your actual Cloudflare API token with DNS:Edit permissions
