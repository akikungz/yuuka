# ConfigMap for Nginx configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pve-ingress-config
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: pve-ingress
data:
  default.conf: |
    server {
        listen 80;

        location / {
            proxy_pass https://<PROXMOX_NODE_IP_ADDRESS>:8006; # Replace with your Proxmox VE IP address
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase buffer sizes for large requests
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Disable request body size limit
            client_max_body_size 0;

            # Timeout settings
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
---
# Nginx pod to handle ingress for Proxmox VE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-ingress
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: pve-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: pve-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: pve-ingress
    spec:
      containers:
        - name: pve-ingress
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: nginx-config
          configMap:
            name: pve-ingress-config
---
# Nginx Service for Proxmox VE Ingress
apiVersion: v1
kind: Service
metadata:
  name: pve-ingress
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: pve-ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: pve-ingress
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Ingress Resource for Proxmox VE
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pve-ingress
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: pve-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pve.fitm.cloud
      secretName: pve-fitm-cloud-tls
  rules:
    - host: pve.fitm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pve-ingress
                port:
                  number: 80
