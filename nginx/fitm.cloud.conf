# Nginx configuration for fitm.cloud
server {
    listen 80;
    server_name fitm.cloud *.fitm.cloud;

    location / {
        proxy_pass http://10.20.30.21:80; # Kubernetes Ingress Controller IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# With SSL configuration
server {
    listen 443 ssl;
    server_name fitm.cloud *.fitm.cloud;

    ssl_certificate /etc/ssl/certs/fitm.cloud.crt;
    ssl_certificate_key /etc/ssl/private/fitm.cloud.key;

    location / {
        proxy_pass http://10.20.30.21:80; # Kubernetes Ingress Controller IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

