apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-issuer
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: cert-issuer
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: thitipong.t@fitm.cloud
    privateKeySecretRef:
      name: cert-issuer-account-key
    skipTLSVerify: true
    solvers:
      - dns01:
          cloudflare:
            email: akikungz@outlook.com
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: cert-issuer
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: thitipong.t@fitm.cloud
    privateKeySecretRef:
      name: letsencrypt-prod
    skipTLSVerify: true
    solvers:
      - http01:
          ingress:
            class: nginx
      # DNS-01 disabled due to transparent proxy blocking Cloudflare API
      # - dns01:
      #     cloudflare:
      #       email: akikungz@outlook.com
      #       apiTokenSecretRef:
      #         name: cloudflare-api-token-secret
      #         key: api-token
