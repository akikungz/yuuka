  midori-overview.json: |
    {
      "uid": "midori-overview",
      "title": "Midori Overview",
      "tags": [
        "midori",
        "observability"
      ],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "PROMETHEUS",
            "label": "Prometheus",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          },
          {
            "type": "datasource",
            "name": "LOKI",
            "label": "Loki",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            }
          },
          {
            "type": "datasource",
            "name": "JAEGER",
            "label": "Jaeger",
            "query": "jaeger",
            "current": {
              "text": "Jaeger",
              "value": "Jaeger"
            }
          },
          {
            "type": "query",
            "name": "service",
            "label": "Service",
            "datasource": "$PROMETHEUS",
            "refresh": 2,
            "query": "label_values(http_requests_total, service)",
            "current": {
              "text": "midori",
              "value": "midori"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / sec",
          "datasource": "$PROMETHEUS",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{service=\"$service\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error rate (5xx)",
          "datasource": "$PROMETHEUS",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{service=\"$service\",status_code=~\"5..\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency (s)",
          "datasource": "$PROMETHEUS",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request rate",
          "datasource": "$PROMETHEUS",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{service=\"$service\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Latency p50/p95/p99",
          "datasource": "$PROMETHEUS",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
