        "midori",
        "observability"
      ],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "PROMETHEUS",
            "label": "Prometheus",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          },
          {
            "type": "datasource",
            "name": "LOKI",
            "label": "Loki",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            }
          },
          {
            "type": "datasource",
            "name": "JAEGER",
            "label": "Jaeger",
            "query": "jaeger",
            "current": {
              "text": "Jaeger",
              "value": "Jaeger"
            }
          },
          {
            "type": "query",
            "name": "service",
            "label": "Service",
            "datasource": "$PROMETHEUS",
            "refresh": 2,
            "query": "label_values(http_requests_total, service)",
            "current": {
              "text": "midori",
