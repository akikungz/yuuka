apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: "prometheus"
          prometheusVersion: "v2"
          timeInterval: "15s"
          exemplarTraceIdDestination:
            - name: trace_id
              datasourceUid: "jaeger"

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        isDefault: false
        editable: false
        jsonData:
          traceToLogs:
            datasourceUid: "loki"
            tags: ["job", "instance", "pod", "namespace"]
      
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: false
---
