  momoi-overview.json: |
    {
      "id": null,
      "uid": "momoi-overview",
      "title": "Momoi Overview",
      "tags": [
        "momoi",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "route",
            "type": "query",
            "datasource": "Prometheus",
            "refresh": 2,
            "query": "label_values(http_requests_total, route)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1
          },
          {
            "name": "status_code",
            "type": "query",
            "datasource": "Prometheus",
            "refresh": 2,
            "query": "label_values(http_requests_total, status_code)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
