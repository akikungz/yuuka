apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: 'FITM Cloud-Based Platform'
        orgId: 1
        folder: 'fitm-cloud'
        type: file
        disableDeletion: false
        editable: true
        updateInterval: 30s
        allowUiUpdate: true
        options:
          path: /var/lib/grafana/dashboards/fitm-cloud
