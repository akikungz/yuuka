apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: "prometheus"
          prometheusVersion: "v2"
          timeInterval: "15s"
          exemplarTraceIdDestination:
            - name: trace_id
              datasourceUid: "jaeger"

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        isDefault: false
        editable: false
        jsonData:
          traceToLogs:
            datasourceUid: "loki"
            tags: ["job", "instance", "pod", "namespace"]
      
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Nodes NotReady",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status!=\"true\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Pending Pods",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\",namespace=~\"$namespace\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Failed Jobs (1h)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(increase(kube_job_status_failed{namespace=~\"$namespace\"}[1h]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Arisu Up",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "min(up{job=\"arisu\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Momoi Dev Up",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "min(up{job=\"momoi-development\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 4,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Midori Dev Up",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "min(up{job=\"midori-development\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Yuzu Dev Up",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "min(up{job=\"yuzu\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 18,
            "y": 4,
            "w": 6,
            "h": 4
          }
        },
        {
          "type": "timeseries",
          "title": "Pods by Phase",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=~\"$namespace\"})",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Deployment Desired vs Available",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (deployment) (kube_deployment_spec_replicas{namespace=~\"$namespace\"})",
              "legendFormat": "{{deployment}} desired",
              "refId": "A"
            },
            {
              "expr": "sum by (deployment) (kube_deployment_status_replicas_available{namespace=~\"$namespace\"})",
              "legendFormat": "{{deployment}} available",
              "refId": "B"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "CPU Usage (%)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Memory Available (%)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "100 * (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Disk Usage (%)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Network Traffic (bytes/s)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total[5m]))",
              "legendFormat": "{{instance}} rx",
              "refId": "A"
            },
            {
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total[5m]))",
              "legendFormat": "{{instance}} tx",
              "refId": "B"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "logs",
          "title": "Logs (namespace)",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\"} |= \"error\"",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 9
          }
        },
        {
          "type": "timeseries",
          "title": "Application RPS",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"arisu\"}[1m]))",
              "legendFormat": "arisu",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"momoi-development\"}[1m]))",
              "legendFormat": "momoi-development",
              "refId": "B"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"midori-development\"}[1m]))",
              "legendFormat": "midori-development",
              "refId": "C"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 38,
            "w": 24,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Application Error Rate (5xx)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"arisu\",status=~\"5..\"}[5m]))",
              "legendFormat": "arisu 5xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_request_errors_total{job=\"momoi-development\"}[5m]))",
              "legendFormat": "momoi-development errors",
              "refId": "B"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"midori-development\",status_code=~\"5..\"}[5m]))",
              "legendFormat": "midori-development 5xx",
              "refId": "C"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 45,
            "w": 24,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Application Latency p95 (s)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"arisu\"}[5m])) by (le))",
              "legendFormat": "arisu",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"momoi-development\"}[5m])) by (le))",
              "legendFormat": "momoi-development",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"midori-development\"}[5m])) by (le))",
              "legendFormat": "midori-development",
              "refId": "C"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 52,
            "w": 24,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Yuzu Jobs Processed (rate)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(yuzu_jobs_processed_total{job=\"yuzu\"}[5m])) by (queue, status)",
              "legendFormat": "{{queue}} {{status}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 59,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Yuzu Active vs Waiting Jobs",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(yuzu_active_jobs{job=\"yuzu\"}) by (queue)",
              "legendFormat": "{{queue}} active",
              "refId": "A"
            },
            {
              "expr": "sum(yuzu_waiting_jobs{job=\"yuzu\"}) by (queue)",
              "legendFormat": "{{queue}} waiting",
              "refId": "B"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 59,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Yuzu Job Duration p95 (s)",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(yuzu_job_duration_seconds_bucket{job=\"yuzu\"}[5m])) by (le, queue))",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 66,
            "w": 12,
            "h": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Yuzu PVE API Errors",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(yuzu_pve_api_calls_total{job=\"yuzu\",status=~\"5..\"}[5m])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 66,
            "w": 12,
            "h": 7
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "global",
        "observability"
      ],
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "namespace",
            "label": "Namespace",
            "datasource": "Prometheus",
            "refresh": 2,
            "query": "label_values(kube_pod_status_phase, namespace)",
            "current": {
              "text": "fitm-cloud",
              "value": "fitm-cloud"
            },
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Global Overview",
      "uid": "global-overview",
      "version": 1
    }
  arisu-overview.json: |
