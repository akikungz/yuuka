apiVersion: apps/v1
kind: Deployment
metadata:
  name: momoi-development
  namespace: fitm-cloud
  labels:
    app: momoi
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: momoi
    app.kubernetes.io/managed-by: argo-cd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: momoi
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: momoi
  template:
    metadata:
      labels:
        app: momoi
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: momoi
    spec:
      initContainers:
        - name: init-momoi
          image: busybox:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: redis-password
          # Create dotenv file with necessary environment variables
          command:
            - sh
            - -c
            - |
              echo "DATABASE_URL=postgresql://postgres:$POSTGRES_PASSWORD@postgres:5432/development" > /mnt/config/.env
              echo "REDIS_URL=redis://:$REDIS_PASSWORD@redis:6379" >> /mnt/config/.env
          volumeMounts:
            - name: config-volume
              mountPath: /mnt/config
        - name: wait-for-postgres
          image: busybox:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: postgres-password
          command:
            - sh
            - -c
            - |
              until nc -z -v -w30 postgres 5432
              do
                echo "Waiting for postgres database connection..."
                sleep 5
              done
              echo "Postgres is up and running!"
        - name: wait-for-redis
          image: busybox:latest
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: redis-password
          command:
            - sh
            - -c
            - |
              until nc -z -v -w30 redis 6379
              do
                echo "Waiting for Redis server connection..."
                sleep 5
              done
              echo "Redis is up and running!"
        - name: wait-for-rustfs
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z -v -w30 rustfs 9000
              do
                echo "Waiting for RustFS server connection..."
                sleep 5
              done
              echo "RustFS is up and running!"
      containers:
        - name: momoi
          image: ghcr.io/akikungz/momoi:development
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: jwt-secret
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: s3-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: s3-secret-access-key
            - name: S3_BUCKET_NAME
              value: "fitm-cloud"
            - name: S3_ENDPOINT
              value: "https://rustfs.fitm.cloud"
            - name: S3_REGION
              value: "us-east-1"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: google-client-secret
            - name: ALLOW_CORS_ORIGINS
              value: "https://dev.fitm.cloud"
            - name: BETTER_AUTH_URL
              value: "https://dev.fitm.cloud"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_PRETTY
              value: "false"
            - name: STORAGE_PROVIDER
              value: "s3"
            - name: OTEL_SERVICE_NAME
              value: "momoi.development"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: PROMETHEUS_BASE_URL
              value: "http://prometheus:9090"
          command:
            - sh
            - -c
            - |
              # exec ./server --env-file /app/.env
              bun run --env-file /app/.env ./src/index.ts
          volumeMounts:
            - name: config-volume
              mountPath: /app/.env
              subPath: .env
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: momoi-development
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: momoi
spec:
  selector:
    app: momoi
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: momoi
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: momoi-development
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: momoi
  annotations:
    spec.ingressClassName: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # nginx.ingress.kubernetes.io/proxy-real-ip-cidr: "10.20.30.0/24"
    # Trust X-Forwarded-For header from Load Balancer
    # nginx.ingress.kubernetes.io/real-ip-header: "X-Forwarded-For"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.fitm.cloud
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: momoi-development
                port:
                  number: 3000
