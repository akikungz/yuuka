apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-collector-data
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          env:
            - name: OTEL_COLLECTOR_BASIC_AUTH_USERNAME
              value: "fitm-cloud"
            - name: OTEL_COLLECTOR_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: otel-collector-basic-auth
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 8889
            - name: health-check
              containerPort: 13133
          volumeMounts:
            - name: otel-config-volume
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: otel-data-volume
              mountPath: /otel-data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: otel-config-volume
          configMap:
            name: otel-config
        - name: otel-data-volume
          persistentVolumeClaim:
            claimName: otel-collector-data
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: otel-collector
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 8889
      targetPort: 8889
    - name: health-check
      port: 13133
      targetPort: 13133
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-collector
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  rules:
    - host: http-otel-collector.fitm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-collector
                port:
                  number: 4318
    - host: grpc-otel-collector.fitm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-collector
                port:
                  number: 4317
