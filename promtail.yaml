apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - nodes
      - namespaces
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: fitm-cloud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    target_config:
      sync_period: 10s

    scrape_configs:
    - job_name: pod-logs
      kubernetes_sd_configs:
        - role: pod
        
      relabel_configs:
        # Keep only pods on the same node
        - source_labels: [__meta_kubernetes_pod_node_name]
          regex: ${HOSTNAME}
          action: keep

        # Keep only pods from namespace fitm-cloud
        - source_labels: [__meta_kubernetes_namespace]
          regex: fitm-cloud
          action: keep

        # Add namespace label
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

        # Add pod name
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

        # Add container name
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container

        # Add node name
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: __host__

        # Correct Kubernetes log file path
        - source_labels:
            - __meta_kubernetes_pod_uid
            - __meta_kubernetes_pod_container_name
          separator: /
          target_label: __path__
          replacement: /var/log/pods/*$1/*.log

    limits_config:
      max_streams: 5000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: promtail
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:2.9.3
          command:
            [
              "sh",
              "-c",
              "ulimit -n 1048576 && /usr/bin/promtail -config.file=/etc/promtail/promtail-config.yaml -config.expand-env=true",
            ]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            capabilities:
              add:
                - SYS_RESOURCE
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: journal
              mountPath: /run/log/journal
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: journal
          hostPath:
            path: /run/log/journal
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: promtail
  ports:
    - protocol: TCP
      port: 9080
      targetPort: 9080
