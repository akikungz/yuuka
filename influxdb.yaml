# InfluxDB Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-ceph-rbd
  resources:
    requests:
      storage: 8Gi
---
# InfluxDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: influxdb
  template:
    metadata:
      labels:
        app: influxdb
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:latest
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "admin"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: influxdb-admin-password
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE
              value: "/run/secrets/influxdb-admin-token"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "fitm"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "fitm-cloud"
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb
            - name: influxdb-admin-token
              mountPath: "/run/secrets/influxdb-admin-token"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: influxdb-data
        - name: influxdb-admin-token
          secret:
            secretName: monitoring-secrets
            items:
              - key: influxdb-admin-token
                path: influxdb-admin-token

      restartPolicy: Always
---
# InfluxDB Service ClusterIP for internal communication
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      protocol: TCP
---
# InfluxDB NodePort Service for external access
apiVersion: v1
kind: Service
metadata:
  name: nodeport-influxdb
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
  type: NodePort
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      protocol: TCP
      nodePort: 30086
---
# InfluxDB Ingress for external access with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: influxdb
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: influxdb
    app.kubernetes.io/managed-by: argocd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - influxdb.fitm.cloud
  #     secretName: influxdb-fitm-cloud-tls
  rules:
    - host: influxdb.fitm.cloud
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: influxdb
                port:
                  number: 8086
