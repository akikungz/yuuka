# MinIO Persistent Volume Claims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: minio
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-ceph-rbd
  resources:
    requests:
      storage: 1Ti
---
# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: minio
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: minio
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "fitm-cloud-role"
        vault.hashicorp.com/agent-inject-secret-minio: "kv/data/fitm-cloud"
        vault.hashicorp.com/agent-inject-template-minio: |
          {{- with secret "kv/data/fitm-cloud" -}}
          export MINIO_ROOT_PASSWORD="{{ .Data.data.MINIO_ROOT_PASSWORD }}"
          {{ end }}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/minio
              set +a
              exec minio server /data --console-address ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: "admin"
          ports:
            - name: minio
              containerPort: 9000
            - name: minio-console
              containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
# MinIO Service
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: minio
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: minio
  ports:
    - name: minio
      port: 9000
      targetPort: 9000
    - name: minio-console
      port: 9001
      targetPort: 9001
---
# MinIO Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: minio
    app.kubernetes.io/managed-by: argocd
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - minio.fitm.cloud
        - minio-console.fitm.cloud
      secretName: minio-tls
  rules:
    - host: minio.fitm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
    - host: minio-console.fitm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
---

