apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-agent-injector
  namespace: fitm-cloud # Deploying it in the same namespace as Vault
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: vault-agent-injector
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-agent-injector
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: vault-agent-injector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"] # Required to fetch TLS cert for webhook
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-agent-injector
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: vault-agent-injector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-agent-injector
subjects:
  - kind: ServiceAccount
    name: vault-agent-injector
    namespace: fitm-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: vault-agent-injector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-agent-injector
  template:
    metadata:
      labels:
        app: vault-agent-injector
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: vault-agent-injector
        app.kubernetes.io/managed-by: argo-cd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      serviceAccountName: vault-agent-injector
      containers:
        - name: injector
          image: hashicorp/vault-k8s:1.1.0 # Use the official K8s tools image
          args:
            - agent-inject
          env:
            # CRITICAL: Address of your manually deployed Vault service
            - name: AGENT_INJECT_VAULT_ADDR
              value: "http://vault.fitm-cloud:8200"
            # Path where the Kubernetes Auth method is enabled
            - name: AGENT_INJECT_VAULT_AUTH_PATH
              value: "auth/kubernetes"
            # TLS skip verify (if Vault doesn't have valid TLS)
            - name: AGENT_INJECT_TLS_AUTO
              value: "vault-agent-injector-cfg"
            - name: AGENT_INJECT_TLS_AUTO_HOSTS
              value: "vault-agent-injector,vault-agent-injector.fitm-cloud,vault-agent-injector.fitm-cloud.svc"
          resources:
            requests:
              memory: "64Mi"
              cpu: "128m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # The Injector webhook needs a way to store its TLS certificates (generated dynamically)
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/ssl/certs/vault
      volumes:
        - name: webhook-certs
          emptyDir: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vault-agent-injector-cfg
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: vault-agent-injector
webhooks:
  - name: agent-injector.hashicorp.com
    clientConfig:
      service:
        name: vault-agent-injector
        namespace: fitm-cloud
        path: "/mutate"
      # The caBundle is added dynamically by the injector later
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        # Prevents the injector from running on itself or system pods
        vault-secrets-injection: "enabled"
    sideEffects: None
    timeoutSeconds: 30
    admissionReviewVersions: ["v1", "v1beta1"]
---
apiVersion: v1
kind: Service
metadata:
  name: vault-agent-injector
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: vault-agent-injector
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: vault-agent-injector
  ports:
    - name: https
      port: 443
      targetPort: 8080 # The default port for the injector controller
      protocol: TCP
