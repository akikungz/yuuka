apiVersion: apps/v1
kind: Deployment
metadata:
  name: midori-development
  namespace: fitm-cloud
  labels:
    app: midori
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: midori
    app.kubernetes.io/managed-by: argo-cd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midori
      app.kubernetes.io/name: fitm-cloud
      app.kubernetes.io/component: midori
  template:
    metadata:
      labels:
        app: midori
        app.kubernetes.io/name: fitm-cloud
        app.kubernetes.io/component: midori
    spec:
      initContainers:
        - name: wait-for-momoi
          image: busybox:latest
          command:
            [
              "sh",
              "-c",
              "until nc -z momoi-development 3000; do echo waiting for momoi; sleep 5; done;",
            ]
        - name: init-momoi
          image: busybox:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: postgres-password
          # Create dotenv file with necessary environment variables
          command:
            - sh
            - -c
            - |
              echo "DATABASE_URL=postgresql://postgres:$POSTGRES_PASSWORD@postgres:5433/postgres" > /mnt/config/.env
          volumeMounts:
            - name: config-volume
              mountPath: /mnt/config
      containers:
        - name: midori
          image: ghcr.io/akikungz/midori:development
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APP_ENV
              value: "development"
            - name: SERVER_API_URL
              value: "http://momoi-development:3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318/v1/traces"
            - name: OTEL_SERVICE_NAME
              value: "midori-dev"
            - name: NEXT_PUBLIC_API_URL
              value: "https://dev.fitm.cloud"
            - name: BETTER_AUTH_URL
              value: "https://dev.fitm.cloud"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: jwt-secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: base-secrets
                  key: google-client-secret
            - name: ALLOW_CORS_ORIGINS
              value: "https://dev.fitm.cloud"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config-volume
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: config-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: midori-development
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: midori
spec:
  selector:
    app: midori
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: midori
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midori-development
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: midori
  annotations:
    spec.ingressClassName: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  tls:
    - hosts:
        - dev.fitm.cloud
      secretName: fitm-cloud-tls
  rules:
    - host: dev.fitm.cloud
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: midori-development
                port:
                  number: 3000
