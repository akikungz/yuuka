name: Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - ".github/workflows/deployment.yaml"
  workflow_dispatch:

jobs:
  create-secrets:
    name: Create Kubernetes Secrets
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify k8s connection
        run: |
          kubectl cluster-info
          kubectl get namespaces fitm-cloud || kubectl create namespace fitm-cloud

      - name: Create base-secrets
        run: |
          kubectl create secret generic base-secrets \
            --namespace fitm-cloud \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
            --from-literal=rustfs-root-password="${{ secrets.RUSTFS_ROOT_PASSWORD }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
            --from-literal=s3-access-key-id="${{ secrets.S3_ACCESS_KEY_ID }}" \
            --from-literal=s3-secret-access-key="${{ secrets.S3_SECRET_ACCESS_KEY }}" \
            --from-literal=google-client-id="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=google-client-secret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=pve-token-id="${{ secrets.PVE_TOKEN_ID }}" \
            --from-literal=pve-token-secret="${{ secrets.PVE_TOKEN_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl label secret base-secrets \
            --namespace fitm-cloud \
            app.kubernetes.io/name=fitm-cloud \
            app.kubernetes.io/managed-by=argocd \
            --overwrite

          kubectl annotate secret base-secrets \
            --namespace fitm-cloud \
            argocd.argoproj.io/sync-wave="0" \
            --overwrite

      - name: Create docker registry secret
        run: |
          kubectl create secret docker-registry ghcr-io-secret \
            --namespace fitm-cloud \
            --docker-server="ghcr.io" \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl label secret ghcr-io-secret \
            --namespace fitm-cloud \
            app.kubernetes.io/name=fitm-cloud \
            app.kubernetes.io/managed-by=argocd \
            --overwrite

          kubectl annotate secret ghcr-io-secret \
            --namespace fitm-cloud \
            argocd.argoproj.io/sync-wave="0" \
            --overwrite

      - name: Create monitoring secret
        run: |
          kubectl create secret generic monitoring-secrets \
            --namespace fitm-cloud \
            --from-literal=grafana-admin-password="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --from-literal=influxdb-admin-password="${{ secrets.INFLUXDB_ADMIN_PASSWORD }}" \
            --from-literal=influxdb-admin-token="${{ secrets.INFLUXDB_ADMIN_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl label secret monitoring-secrets \
            --namespace fitm-cloud \
            app.kubernetes.io/name=fitm-cloud \
            app.kubernetes.io/managed-by=argocd \
            --overwrite

          kubectl annotate secret monitoring-secrets \
            --namespace fitm-cloud \
            argocd.argoproj.io/sync-wave="0" \
            --overwrite

      - name: Create tls secret
        run: |
          kubectl create secret generic cloudflare-tls \
            --namespace fitm-cloud \
            --from-literal=tls.crt="${{ secrets.CLOUDFLARE_TLS_CRT }}" \
            --from-literal=tls.key="${{ secrets.CLOUDFLARE_TLS_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl label secret cloudflare-tls \
            --namespace fitm-cloud \
            app.kubernetes.io/name=fitm-cloud \
            app.kubernetes.io/managed-by=argocd \
            --overwrite

          kubectl annotate secret cloudflare-tls \
            --namespace fitm-cloud \
            argocd.argoproj.io/sync-wave="0" \
            --overwrite

      - name: Verify created secrets
        run: |
          kubectl get secrets --namespace fitm-cloud
          kubectl get secret base-secrets --namespace fitm-cloud -o yaml | grep -E 'name:|namespace:|labels:|annotations:|type:'
          kubectl get secret ghcr-io-secret --namespace fitm-cloud -o yaml | grep -E 'name:|namespace:|labels:|annotations:|type:'
          kubectl get secret monitoring-secrets --namespace fitm-cloud -o yaml | grep -E 'name:|namespace:|labels:|annotations:|type:'
          kubectl get secret cloudflare-tls --namespace fitm-cloud -o yaml | grep -E 'name:|namespace:|labels:|annotations:|type:'

      - name: Restart deployments to pick up new secrets
        run: |
          echo "Restarting deployments to pick up new secrets..."

          # Restart production deployments
          kubectl rollout restart deployment/momoi-main --namespace fitm-cloud || echo "Deployment momoi not found, skipping..."
          kubectl rollout restart deployment/midori-main --namespace fitm-cloud || echo "Deployment midori not found, skipping..."
          kubectl rollout restart deployment/yuzu-main --namespace fitm-cloud || echo "Deployment yuzu not found, skipping..."

          # Restart development deployments
          kubectl rollout restart deployment/momoi-development --namespace fitm-cloud || echo "Deployment momoi-development not found, skipping..."
          kubectl rollout restart deployment/midori-development --namespace fitm-cloud || echo "Deployment midori-development not found, skipping..."
          kubectl rollout restart deployment/yuzu-development --namespace fitm-cloud || echo "Deployment yuzu-development not found, skipping..."

          echo "Waiting for rollouts to complete..."
          sleep 10

          echo "Rollout restart commands issued. Pods will restart to pick up new secrets."

